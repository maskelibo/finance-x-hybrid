# KCHOL — Sum-of-the-Parts (SOTP) / NAV Breakdown
# Source: KCHOL 2024 Annual Report + most recent KAP segment disclosures
# Curated: 2026-04-28 — auto_curated_pending_operator_review
#
# Operator review checklist:
#   1. Verify each subsidiary's stake_pct against the latest KAP
#      "Bağlı Ortaklıklar" filing.
#   2. Cross-check market_cap_try for listed peers (TUPRS, FROTO, ARCLK,
#      AYGAZ, OTKAR, TOASO) against current BIST close × shares.
#   3. For unlisted/private holdings, verify NAV from segment EBITDA
#      × peer multiple OR latest IR-disclosed NAV figure.
#   4. Holding-level net debt should match KAP standalone bilanço.
#   5. Holding discount must be reasonable for a Turkish conglomerate
#      (typically 15-35%).
#
# Schema rules:
#   - Listed subsidiaries MUST have ticker + market_cap_try + stake_pct.
#   - Private subsidiaries use nav_contribution_try with method note.
#   - Sum of nav_contribution_try across all holdings → group NAV gross.
#   - holding_net_debt_try is subtracted to reach group NAV net.
#   - holding_discount_pct applied → adjusted NAV.
#   - Per-share NAV = adjusted NAV / shares_outstanding_mn (mn shares).

