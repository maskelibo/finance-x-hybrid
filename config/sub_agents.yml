# Sub-agent registry — populated incrementally by Part 2 / Block S phases.
# Each phase (S2..S11) appends entries for a single parent agent.
# Shape: see backend/src/sub-agents/types.ts (SubAgentDef).

version: 1.0.0
last_updated: "2026-04-25"  # S9 added

sub_agents:
  # ===== S2 — data_collection (4 sub-agents, parallel) =====
  - id: dc_financials_collector
    parent_agent_id: data_collection
    display_name: "Financial Statements Collector"
    description: "Legacy data_collection manifest'inden financial_report dokümanlarını IS/BS/CF/SE tablolarına deterministik olarak dağıtır."
    # D-listesi refactor (2026-04-24): LLM tier 18 dk tool-call loop'una
    # giriyordu (930s deadline, 0 byte stdout). Legacy data_collection
    # manifest'i zaten KAP'tan 5Y financial_report'ları fetch ediyor —
    # sub-agent onu parse edip schema-compliant çıktıya çevirir. 0 LLM, <1s.
    tier: deterministic
    python_module: financex.subagents.dc_financials
    timeout_ms: 60000
    isolated_context: false
    output_schema_path: schemas/sub-agents/dc_financials_collector.json
    parallelizable: true
    retry_max: 2

  - id: dc_disclosure_collector
    parent_agent_id: data_collection
    display_name: "KAP Disclosure Collector"
    description: "Son 5 yıl KAP bildirimlerini toplar, material flag'ler."
    tier: llm
    model: haiku
    timeout_ms: 240000
    isolated_context: false
    output_schema_path: schemas/sub-agents/dc_disclosure_collector.json
    parallelizable: true
    retry_max: 2

  - id: dc_market_profile_collector
    parent_agent_id: data_collection
    display_name: "Market Profile Collector"
    description: "OHLCV, market cap, shares outstanding, free float, dividend history."
    tier: deterministic
    python_module: financex.subagents.dc_market_profile
    timeout_ms: 120000
    isolated_context: true
    output_schema_path: schemas/sub-agents/dc_market_profile_collector.json
    parallelizable: true
    retry_max: 3

  - id: dc_reference_docs_collector
    parent_agent_id: data_collection
    display_name: "Reference Documents Collector"
    description: "Annual report + IR presentation (core narrative docs)."
    tier: llm
    model: sonnet
    # 2026-04-24 D-list refactor: scope narrowed from 4 doc types to 2
    # (annual_report + ir_presentation). Sustainability + governance moved
    # out of scope (esg_agent / context_extraction own them). Cap bumped
    # 900s → 1200s so 88% utilization drops to ~35-40% with the narrower
    # scope — plenty of headroom, no hang risk.
    timeout_ms: 1200000
    isolated_context: false
    output_schema_path: schemas/sub-agents/dc_reference_docs_collector.json
    parallelizable: true
    retry_max: 2

