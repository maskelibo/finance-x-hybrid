# Each phase (S2..S11) appends entries for a single parent agent.
# Shape: see backend/src/sub-agents/types.ts (SubAgentDef).

version: 1.0.0
last_updated: "2026-04-26"  # S12 — val_dcf split to 4 sub-agents (3 det + 1 narrow LLM) due to Sonnet variance %33 hang. Total registry 40.

