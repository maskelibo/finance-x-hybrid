[project]
name = "financex"
version = "0.1.0"
description = "Finance X deterministic Python runners — data collection, PDF/XBRL parsing, financial math. Hybrid-architecture companion to the Node.js backend."
readme = "README.md"
authors = [
    { name = "maskelibo", email = "ibrahimpeyman@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "lxml>=6.0.4",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pdfplumber>=0.11.9",
    "pydantic>=2.13.1",
    "pymupdf>=1.27.2.2",
    "python-dateutil>=2.9.0.post0",
    "structlog>=25.5.0",
    "ta>=0.11.0",
    "typer>=0.24.1",
]

[project.scripts]
financex = "financex.cli:app"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.10",
]
