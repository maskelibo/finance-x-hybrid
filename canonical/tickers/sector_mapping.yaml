# canonical/tickers/sector_mapping.yaml
#
# Ticker → sector resolution. Single source of truth.
# Everything else (agent prompts, schema enforcement, sector playbook selection,
# peer-set heuristics) MUST consult this file via the canonical loader.
#
# "industrial" fallback is only legal for tickers NOT listed here and only
# after an explicit escalation to the sector_competition agent. It is never
# a silent default.
#
# Rule precedence: this file > any agent system_prompt mention > any memory.md
# mention > runtime heuristic.

