# When a ticker is NOT in this file, the resolver must:
#   1. Not silently fall back to "industrial".
#   2. Record UNCLASSIFIED_TICKER in the run's findings[].
#   3. Escalate to sector_competition with the raw ticker and business
#      description so a mapping can be proposed; the human gate adds it here.
fallback_policy:
  silent_default: forbidden
  escalate_to: sector_competition
  escalation_payload: [ticker, business_description, kap_sector_code]
  runtime_behaviour: |
    Unknown tickers produce a 'UNCLASSIFIED_TICKER' finding on the CEO
    contract. The run still completes with industrial_generic defaults,
    but the formatter must stamp 'SECTOR: UNCLASSIFIED — industrial_generic
    defaults applied' at the top of the report.
