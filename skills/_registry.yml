skills:
  # ------- Data acquisition -------
  - id: bist-kap-fetching
    name: "BIST KAP Disclosure Fetching"
    description: "KAP API'sinden disclosure + PDF çekme; rate-limit, retry, JSON metadata parse."
    triggers: ["kap disclosure", "faaliyet raporu", "bildirim çek", "yönetim kurulu raporu", "kap.org.tr", "financial statement filing"]
    applies_to_agents: [data_collection, kap_watch, event_classification]
    category: data_acquisition
    priority: critical

  # ------- Accounting -------
  - id: ias29-inflation-accounting
    name: "IAS 29 Hyperinflation Accounting"
    description: "Turkiye TUFE >%100 donemlerinde IAS 29. Net monetary position, parasal kazanc/kayip, adjusted EBITDA/NI."
    triggers: ["ias 29", "ias29", "enflasyon muhasebesi", "parasal kazanc", "hyperinflation", "tufe", "monetary position"]
    applies_to_agents: [parse_standardization, reconciliation, financial_analysis, valuation_agent]
    category: accounting
    priority: critical

  - id: ifrs16-lease-adjustment
    name: "IFRS 16 Lease Adjustments"
    description: "Operating lease faiz ve itfa ayristirma; EBITDAR icin kira giderini operating cost'tan geri ekleme."
    triggers: ["ifrs 16", "operating lease", "kira gideri", "ebitdar", "lease liability", "right of use"]
    applies_to_agents: [parse_standardization, reconciliation, financial_analysis, valuation_agent]
    category: accounting
    priority: high

  - id: financial-statements-extraction
    name: "Financial Statements Extraction"
    description: "PDF faaliyet raporundan IS/BS/CF/SE tablolarini extract etme; IFRS/SPK layout."
    triggers: ["gelir tablosu", "bilanco", "nakit akim", "income statement", "balance sheet", "cash flow", "spk", "konsolide finansal"]
    applies_to_agents: [parse_standardization, reconciliation, data_collection]
    category: data_acquisition
    priority: critical

  # ------- Ratios / metrics -------
  - id: financial-ratios-calculation
    name: "28 Mandatory Metric Formulas"
    description: "DSO/DIO/DPO/CCC/NWC/ROE/ROCE/ROIC/FCF... 28 Chairman zorunlu metrik formul rehberi."
    triggers: ["28 metric", "ratio", "dso", "dio", "dpo", "ccc", "roe", "roce", "roic", "fcf", "nwc", "capex/ebitda"]
    applies_to_agents: [financial_analysis, reconciliation]
    category: financial_analysis
    priority: critical

  # ------- Valuation -------
  - id: dcf-valuation
    name: "DCF Valuation"
    description: "WACC, terminal value, scenario analysis; 5-yillik projeksiyon + sensitivity table."
    triggers: ["dcf", "discounted cash flow", "wacc", "terminal value", "intrinsic value", "dfa"]
    applies_to_agents: [valuation_agent, strategic_synthesis]
    category: valuation
    priority: critical

  - id: sotp-valuation
    name: "SOTP Valuation"
    description: "Holding/konglomera icin Sum-of-the-Parts; net asset value, NAV discount."
    triggers: ["sotp", "sum of the parts", "holding", "nav", "discount to nav", "konglomera"]
    applies_to_agents: [valuation_agent, sector_competition, strategic_synthesis]
    category: valuation
    priority: high

  - id: altman-z-score
    name: "Altman Z-Score"
    description: "Bankruptcy risk scoring: Z = 1.2A + 1.4B + 3.3C + 0.6D + 1.0E (public manufacturing)."
    triggers: ["altman", "z-score", "bankruptcy risk", "iflas riski", "distress"]
    applies_to_agents: [financial_analysis, valuation_agent]
    category: financial_analysis
    priority: medium

  - id: piotroski-f-score
    name: "Piotroski F-Score"
    description: "Quality score 9 binary criterion: profitability, leverage, operating efficiency."
    triggers: ["piotroski", "f-score", "quality score", "kalite skoru"]
    applies_to_agents: [financial_analysis]
    category: financial_analysis
    priority: medium

